[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "overfit-detector"
version = "0.1.0"
description = "Quantify how likely a trading strategy backtest is overfit (Deflated Sharpe Ratio + Probability of Backtest Overfitting)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
dev = ["pytest>=7.4"]

[project.scripts]
overfit-detector = "overfit_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: Monte Carlo validation; deselect with -m 'not slow'",
]
filterwarnings = ["error::DeprecationWarning"]
